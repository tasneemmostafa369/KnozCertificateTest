<div class="min-h-screen bg-slate-50" [attr.dir]="direction">
  <!-- Toast Notification -->
  @if (showSaveToast()) {
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 animate-fade-in-down rounded-xl bg-knoz-green px-6 py-3 text-white shadow-lg flex items-center gap-3">
      <i class="fa-solid fa-circle-check text-knoz-gold"></i>
      <span class="font-medium text-sm">{{ getText('settingsSaved') }}</span>
    </div>
  }

  <header class="sticky top-0 z-10 flex flex-col gap-4 border-b border-gray-200 bg-white/80 px-4 py-4 backdrop-blur-md sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-10 shadow-sm">
    <div class="min-w-0">
      <h1 class="text-xl font-bold text-gray-800 tracking-tight sm:text-2xl">{{ getText('settingsTitle') }}</h1>
      <p class="mt-1 text-sm text-gray-500">{{ getText('settingsDesc') }}</p>
    </div>
    <div class="flex w-full flex-col gap-3 sm:w-auto sm:flex-row sm:items-center">
      <a routerLink="/dashboard" class="flex w-full items-center justify-center gap-2 rounded-xl bg-white px-5 py-2.5 text-sm font-bold text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 transition-all hover:bg-gray-50 hover:text-knoz-green sm:w-auto">
        <i class="fa-solid" [ngClass]="direction === 'rtl' ? 'fa-arrow-right' : 'fa-arrow-left'"></i>
        {{ getText('backToDashboard') }}
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="flex flex-col gap-8">
      
      <!-- Language Settings -->
      <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="border-b border-gray-100 bg-gray-50/50 px-6 py-4">
          <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-language text-knoz-green"></i>
            {{ getText('appLanguage') }}
          </h2>
          <p class="text-sm text-gray-500 mt-1">{{ getText('appLanguageDesc') }}</p>
        </div>
        <div class="p-6">
          <div class="flex flex-col sm:flex-row gap-4">
            <button (click)="onLanguageChange('ar')" 
                    class="flex-1 rounded-xl border-2 p-4 text-center transition-all"
                    [ngClass]="selectedLanguage === 'ar' ? 'border-knoz-green bg-knoz-green/5' : 'border-gray-200 hover:border-gray-300'">
              <div class="text-xl font-bold mb-1" [ngClass]="selectedLanguage === 'ar' ? 'text-knoz-green' : 'text-gray-700'">{{ getText('arabic') }}</div>
              <div class="text-xs text-gray-500">اللغة العربية</div>
            </button>
            <button (click)="onLanguageChange('en')" 
                    class="flex-1 rounded-xl border-2 p-4 text-center transition-all"
                    [ngClass]="selectedLanguage === 'en' ? 'border-knoz-green bg-knoz-green/5' : 'border-gray-200 hover:border-gray-300'">
              <div class="text-xl font-bold mb-1" [ngClass]="selectedLanguage === 'en' ? 'text-knoz-green' : 'text-gray-700'">{{ getText('english') }}</div>
              <div class="text-xs text-gray-500">English Language</div>
            </button>
          </div>
        </div>
      </section>

      <!-- Default Template Settings -->
      <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="border-b border-gray-100 bg-gray-50/50 px-6 py-4">
          <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-certificate text-knoz-green"></i>
            {{ getText('defaultTemplateTitle') }}
          </h2>
          <p class="text-sm text-gray-500 mt-1">{{ getText('defaultTemplateDesc') }}</p>
        </div>
        <div class="p-6">
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <!-- Classic -->
            <button type="button" (click)="onTemplateChange('classic')"
                 class="group rounded-2xl border-2 bg-white p-4 text-start transition-all duration-300 hover:shadow-xl"
                 [ngClass]="selectedTemplate === 'classic' ? 'border-knoz-gold shadow-lg scale-105 ring-4 ring-knoz-gold/10' : 'border-gray-100 hover:border-gray-300 hover:-translate-y-1'">
              <!-- Preview -->
              <div class="relative aspect-[297/210] overflow-hidden rounded-xl bg-[#FDFCF8] shadow-sm">
                  <div class="absolute inset-2 border-2 border-knoz-gold"></div>
                  <div class="absolute inset-4 border border-knoz-gold/40"></div>
                  <div class="relative flex h-full flex-col items-center justify-center text-center">
                      <div class="flex h-7 w-7 items-center justify-center text-xs font-bold text-knoz-green">K</div>
                      <p class="mt-1 text-[5px] font-semibold tracking-[0.25em] text-knoz-green">{{ getText('academyName') }}</p>
                      <p class="mt-3 font-serif text-[10px] font-bold tracking-wide text-knoz-green">{{ getText('certificateTitle') }}</p>
                      <div class="mt-1 h-px w-10 bg-knoz-gold"></div>
                      <p class="mt-3 font-serif text-[8px] font-bold text-knoz-green">{{ getText('studentName') }}</p>
                      <p class="mt-1 text-[5px] text-gray-500 break-words whitespace-normal max-w-[90%] px-1 leading-tight overflow-hidden line-clamp-2">{{ getText('courseName') }}</p>
                  </div>
              </div>
              <!-- Name -->
              <div class="mt-4 flex items-center justify-between">
                  <div>
                      <p class="font-bold text-gray-800" [class.text-knoz-green]="selectedTemplate === 'classic'">{{ getText('classicTemplate') }}</p>
                      <p class="mt-1 text-xs text-gray-500">{{ getText('classicTemplateDescription') }}</p>
                  </div>
                  @if (selectedTemplate === 'classic') {
                      <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-knoz-gold text-sm font-bold text-white shadow-sm">✓</span>
                  }
              </div>
            </button>
            <!-- Elegant -->
            <button type="button" (click)="onTemplateChange('elegant')"
                 class="group rounded-2xl border-2 bg-white p-4 text-start transition-all duration-300 hover:shadow-xl"
                 [ngClass]="selectedTemplate === 'elegant' ? 'border-knoz-gold shadow-lg scale-105 ring-4 ring-knoz-gold/10' : 'border-gray-100 hover:border-gray-300 hover:-translate-y-1'">
              <!-- Preview -->
              <div class="relative aspect-[297/210] overflow-hidden rounded-xl bg-knoz-green shadow-sm">
                  <div class="absolute inset-2 border border-knoz-gold"></div>
                  <div class="absolute inset-4 border border-knoz-gold/60"></div>
                  <div class="relative flex h-full flex-col items-center justify-center text-center">
                      <div class="flex h-7 w-7 items-center justify-center rounded-full border border-knoz-gold bg-white p-1 text-xs font-bold text-knoz-gold">K</div>
                      <p class="mt-1 text-[5px] font-semibold tracking-[0.25em] text-knoz-gold">{{ getText('academyName') }}</p>
                      <p class="mt-3 font-serif text-[10px] font-bold tracking-wide text-knoz-gold">{{ getText('certificateTitle') }}</p>
                      <div class="mt-1 h-px w-10 bg-knoz-gold"></div>
                      <p class="mt-3 font-serif text-[8px] font-bold text-white">{{ getText('studentName') }}</p>
                      <p class="mt-1 text-[5px] text-knoz-gold/80 break-words whitespace-normal max-w-[90%] px-1 leading-tight overflow-hidden line-clamp-2">{{ getText('courseName') }}</p>
                  </div>
              </div>
              <!-- Name -->
              <div class="mt-4 flex items-center justify-between">
                  <div>
                      <p class="font-bold text-gray-800" [class.text-knoz-green]="selectedTemplate === 'elegant'">{{ getText('elegantTemplate') }}</p>
                      <p class="mt-1 text-xs text-gray-500">{{ getText('elegantTemplateDescription') }}</p>
                  </div>
                  @if (selectedTemplate === 'elegant') {
                      <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-knoz-gold text-sm font-bold text-white shadow-sm">✓</span>
                  }
              </div>
            </button>
            <!-- Quran -->
            <button type="button" (click)="onTemplateChange('quran')"
                 class="group rounded-2xl border-2 bg-white p-4 text-start transition-all duration-300 hover:shadow-xl"
                 [ngClass]="selectedTemplate === 'quran' ? 'border-knoz-gold shadow-lg scale-105 ring-4 ring-knoz-gold/10' : 'border-gray-100 hover:border-gray-300 hover:-translate-y-1'">
              <!-- Preview -->
              <div class="relative aspect-[297/210] overflow-hidden rounded-xl bg-knoz-green font-['Tajawal'] shadow-sm">
                  <div class="absolute inset-0 opacity-[0.05] pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M30 0l30 30-30 30L0 30z\' fill=\'%23C8A559\' fill-rule=\'evenodd\'/%3E%3C/svg%3E'); background-size: 20px 20px;"></div>
                  <span class="absolute left-2 top-1 text-sm text-knoz-gold">❈</span>
                  <span class="absolute right-2 top-1 text-sm text-knoz-gold">❈</span>
                  <span class="absolute bottom-1 left-2 text-sm text-knoz-gold">❈</span>
                  <span class="absolute bottom-1 right-2 text-sm text-knoz-gold">❈</span>
                  <div class="absolute inset-2 border-2 border-knoz-gold"></div>
                  <div class="absolute inset-4 border border-knoz-gold/70"></div>
                  <div class="absolute inset-6 border border-knoz-gold/30"></div>
                  <div class="relative flex h-full flex-col items-center justify-center text-center">
                      <div class="relative flex items-center justify-center p-1 before:absolute before:inset-0 before:rounded-full before:bg-white/20 before:backdrop-blur-md">
                        <span class="relative z-10 text-lg text-knoz-gold">❖</span>
                      </div>
                      <p class="mt-1 text-[5px] font-semibold tracking-[0.25em] text-knoz-gold font-['Amiri']">{{ getText('academyName') }}</p>
                      <p class="mt-3 font-serif text-[10px] font-bold text-knoz-gold font-['Amiri']">{{ getText('certificateTitle') }}</p>
                      <div class="mt-1 h-px w-10 bg-knoz-gold"></div>
                      <p class="mt-3 font-serif text-[8px] font-bold text-white font-['Amiri']">{{ getText('studentName') }}</p>
                      <p class="mt-1 text-[5px] text-knoz-gold/80 font-['Amiri'] break-words whitespace-normal max-w-[90%] px-1 leading-tight overflow-hidden line-clamp-2">{{ getText('quranCourse') }}</p>
                      <span class="absolute bottom-3 text-xs text-knoz-gold">۞</span>
                  </div>
              </div>
              <!-- Name -->
              <div class="mt-4 flex items-center justify-between">
                  <div>
                      <p class="font-bold text-gray-800" [class.text-knoz-green]="selectedTemplate === 'quran'">{{ getText('quranTemplate') }}</p>
                      <p class="mt-1 text-xs text-gray-500">{{ getText('quranTemplateDescription') }}</p>
                  </div>
                  @if (selectedTemplate === 'quran') {
                      <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-knoz-gold text-sm font-bold text-white shadow-sm">✓</span>
                  }
              </div>
            </button>
          </div>
        </div>
      </section>
      
    </div>
  </main>
</div>
<style>
@keyframes fade-in-down {
  0% {
    opacity: 0;
    transform: translate(-50%, -10px);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}
.animate-fade-in-down {
  animation: fade-in-down 0.3s ease-out forwards;
}
</style>
